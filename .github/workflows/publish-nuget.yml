name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version; empty uses the tag version or Directory.Build.props"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  publish:
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UCanAccess.slnx

      - name: Build
        run: dotnet build UCanAccess.slnx -c Release --no-restore

      - name: Determine version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = $env:VERSION_INPUT.Trim()
          if (-not $version -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if (-not $version) {
            [xml]$props = Get-Content -Raw Directory.Build.props
            $version = [string]$props.Project.PropertyGroup.Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid NuGet version: '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version"

      - name: Pack
        run: |
          dotnet pack src/UCanAccess/UCanAccess.csproj -c Release --no-build --no-restore -p:Version=${{ steps.version.outputs.version }} --output artifacts/packages
          dotnet pack src/UCanAccess.File/UCanAccess.File.csproj -c Release --no-build --no-restore -p:Version=${{ steps.version.outputs.version }} --output artifacts/packages

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: KrzysztofDusko

      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "NuGet OIDC login did not return an API key" >&2; exit 1; }
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          test "${#packages[@]}" -eq 2 || { echo "Expected two packages, found ${#packages[@]}" >&2; exit 1; }
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
