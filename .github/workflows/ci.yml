name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          # Temurin is only the CI default. The oracle scripts accept any
          # compatible JDK distribution; Oracle-vendor Java is not required.
          distribution: temurin
          java-version: 21

      - name: Restore
        run: dotnet restore UCanAccess.slnx

      - name: Build
        run: dotnet build UCanAccess.slnx -c Release --no-restore

      - name: Prepare Java oracle toolchain
        run: pwsh tools/JavaOracle/prepare.ps1

      - name: Test file format library
        run: dotnet test tests/UCanAccess.File.Tests/UCanAccess.File.Tests.csproj -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test ADO.NET provider
        run: dotnet test tests/UCanAccess.Tests/UCanAccess.Tests.csproj -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test pure .NET Access encryption codec
        run: dotnet test tests/UCanAccess.AccessCrypto.Tests/UCanAccess.AccessCrypto.Tests.csproj -c Release --no-build --no-restore

      - name: Upload coverage
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  oracle-consistency:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          # Temurin is only the CI default. The local oracle script accepts any
          # compatible JDK distribution; Oracle-vendor Java is not required.
          distribution: temurin
          java-version: 21

      - name: Verify compatible Java toolchain
        run: |
          java -version
          javac -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET parity runner
        run: dotnet restore UCanAccess.slnx

      # Regenerates every oracle artifact with the original Java libraries:
      # database dumps, SQL behavior, and freshly generated database files.
      - name: Regenerate all oracles
        run: pwsh tools/JavaOracle/run.ps1

      - name: Verify oracles are up to date
        run: git diff --exit-code -- tests/fixtures/oracle tests/fixtures/sql

  # Microsoft Access is not installed on GitHub-hosted runners.  An
  # administrator can opt into this job on a self-hosted Windows runner with
  # Access/DAO by setting the repository variable UCANACCESS_ACCESS_COM=true
  # and the secret UCANACCESS_ACCESS_FIXTURE_PASSWORD.
  access-com:
    # Never run repository pull-request code on the Access runner.  Only
    # trusted pushes to main/master/tags and an explicitly dispatched run may use it.
    if: vars.UCANACCESS_ACCESS_COM == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))))
    timeout-minutes: 20
    runs-on: [self-hosted, windows, access]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UCanAccess.slnx

      - name: Build
        run: dotnet build UCanAccess.slnx -c Release --no-restore

      - name: Verify encrypted ACCDB interoperability
        env:
          UCANACCESS_ACCESS_COM: 'true'
          UCANACCESS_ACCESS_FIXTURE_PASSWORD: ${{ secrets.UCANACCESS_ACCESS_FIXTURE_PASSWORD }}
        run: dotnet test tests/UCanAccess.AccessCrypto.Tests/UCanAccess.AccessCrypto.Tests.csproj -c Release --no-build --no-restore --filter 'Category=AccessCom'
