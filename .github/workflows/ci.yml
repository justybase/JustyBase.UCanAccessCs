name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UCanAccess.slnx

      - name: Build
        run: dotnet build UCanAccess.slnx -c Release --no-restore

      - name: Pack libraries
        run: |
          dotnet pack src/UCanAccess/UCanAccess.csproj -c Release --no-build --no-restore --output artifacts/packages
          dotnet pack src/UCanAccess.File/UCanAccess.File.csproj -c Release --no-build --no-restore --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Test
        run: dotnet test UCanAccess.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  oracle-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The parity tests build the same solution as the regular CI job.  Keep
      # this job self-contained so missing Java/JAR dependencies fail the
      # dedicated oracle check instead of silently turning into skips.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET parity runner
        run: dotnet restore UCanAccess.slnx

      # Regenerates every oracle artifact with the ORIGINAL Java libraries:
      #   - DbDump: read parity JSON for every .mdb fixture
      #   - SqlDump: SQL behavior parity JSON (original UCanAccess JDBC)
      #   - DbGen: creates fresh .mdb files (cross-check: Java-written files
      #     must be readable by the port)
      - name: Regenerate all oracles
        run: pwsh tools/JavaOracle/run.ps1

      - name: Verify oracles are up to date
        run: git diff --exit-code -- tests/fixtures/oracle tests/fixtures/sql

      - name: Run Java-backed SQL parity
        run: dotnet test UCanAccess.slnx -c Release --no-restore --filter FullyQualifiedName~SqlParityTests
