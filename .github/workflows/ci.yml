name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UCanAccess.slnx

      - name: Build
        run: dotnet build UCanAccess.slnx -c Release --no-restore

      - name: Test
        run: dotnet test UCanAccess.slnx -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  oracle-consistency:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET parity runner
        run: dotnet restore UCanAccess.slnx

      # Regenerates every oracle artifact with the original Java libraries:
      # database dumps, SQL behavior, and freshly generated database files.
      - name: Regenerate all oracles
        run: pwsh tools/JavaOracle/run.ps1

      - name: Verify oracles are up to date
        run: git diff --exit-code -- tests/fixtures/oracle tests/fixtures/sql

      - name: Run Java-backed SQL parity
        run: dotnet test UCanAccess.slnx -c Release --no-restore --filter FullyQualifiedName~SqlParityTests
